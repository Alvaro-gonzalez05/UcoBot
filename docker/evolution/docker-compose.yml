# Evolution API - entorno LOCAL de prueba (piloto).
#
# Esto NO va a producción tal cual: es para validar que Evolution sirve para
# UcoBot antes de pagar hosting. Levanta:
#   - evolution: la API (puerto 8080)
#   - postgres:  persistencia de instancias/sesiones (si esto no persiste,
#                el número pide QR de nuevo en cada reinicio)
#   - redis:     cache de sesiones Baileys (recomendado por la doc oficial)
#
# Uso:
#   1. copiar .env.example a .env y cambiar EVOLUTION_API_KEY
#   2. docker compose up -d
#   3. abrir http://localhost:8080/manager  (login con la API key)
#   4. crear una instancia y escanear el QR con un número de PRUEBA
#      (¡no usar el número de un cliente para el piloto!)

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: ucobot_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Auth global de la API. Todas las requests llevan header `apikey`.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      SERVER_URL: http://localhost:8080

      # Persistencia en Postgres (obligatoria para no perder sesiones)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"   # los mensajes viven en Supabase, no acá
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"

      # Cache Redis (sesiones Baileys)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"

      # Webhook global hacia UcoBot (dev local con `npm run dev`).
      # host.docker.internal = tu máquina vista desde el contenedor.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${UCOBOT_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # Idioma de logs y housekeeping
      LANGUAGE: es
      DEL_INSTANCE: "false"   # no borrar instancias desconectadas automáticamente
      LOG_LEVEL: ERROR,WARN,INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: ucobot_evolution_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ucobot_evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data

volumes:
  evolution_pg_data:
  evolution_redis_data:
